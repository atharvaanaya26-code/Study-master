<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyRun - UP Board Class 10 Hindi Medium</title>
    
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg: #0f172a; /* Deep Modern Slate/Dark */
            --card-bg: #1e293b;
            --accent: #10b981; /* Emerald Green */
            --accent-hover: #059669;
            --text-light: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            --transition: all 0.3s ease-in-out;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-light);
            min-height: 100vh;
        }

        /* Splash Screen */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            text-align: center;
            padding: 20px;
        }

        #splash-screen .icon-box {
            font-size: 4rem;
            color: var(--accent);
            margin-bottom: 15px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        #splash-screen h1 {
            font-size: 2.8rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
        }

        #splash-screen p {
            color: var(--text-dim);
            margin-bottom: 35px;
            font-size: 1rem;
        }

        #splash-screen button {
            background: linear-gradient(135deg, #10b981 0%, #34d399 100%);
            border: none;
            color: #0f172a;
            padding: 14px 45px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
            transition: var(--transition);
        }

        #splash-screen button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(16, 185, 129, 0.6);
        }

        /* Main App Interface */
        #app {
            display: none;
            padding-bottom: 40px;
        }

        header {
            background-color: var(--card-bg);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header .logo-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        header i {
            color: var(--accent);
            font-size: 1.5rem;
        }

        header .title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-light);
        }

        header .subtitle {
            font-size: 0.75rem;
            color: var(--accent);
            font-weight: 500;
        }

        /* Dashboard Grid */
        #dashboard {
            padding: 25px 20px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            max-width: 800px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 22px 15px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow);
        }

        .card:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
        }

        .card i {
            font-size: 2.2rem;
            color: var(--accent);
            margin-bottom: 12px;
            display: inline-block;
        }

        .card h3 {
            font-size: 1rem;
            color: var(--text-light);
            font-weight: 600;
        }

        /* Content Container */
        #content-area {
            display: none;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .btn-back {
            background-color: var(--card-bg);
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .section-header {
            font-size: 1.4rem;
            color: var(--text-light);
            margin-bottom: 15px;
            border-left: 4px solid var(--accent);
            padding-left: 10px;
        }

        .item-list {
            list-style: none;
        }

        .item-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-title {
            font-weight: 500;
            color: var(--text-light);
            font-size: 0.95rem;
        }

        .item-btn {
            background-color: var(--accent);
            color: #0f172a;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* Formula Box */
        .formula-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .formula-box h4 {
            color: var(--accent);
            margin-bottom: 8px;
        }

        .formula-code {
            background-color: #0f172a;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            color: #38bdf8;
            margin-top: 5px;
        }

        /* Quiz Box */
        .quiz-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 12px;
        }

        .quiz-option {
            background-color: var(--bg);
            border: 1px solid var(--border);
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
        }

        .quiz-option:hover {
            border-color: var(--accent);
            background-color: #1e293b;
        }

        textarea {
            width: 100%;
            height: 100px;
            background-color: #0f172a;
            border: 1px solid var(--border);
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <!-- 1. SPLASH SCREEN -->
    <div id="splash-screen">
        <div class="icon-box"><i class="fas fa-running"></i></div>
        <h1>StudyRun</h1>
        <p>UP Board Class 10th (हिंदी माध्यम) - SelfStudy Hub</p>
        <button onclick="launchApp()">START</button>
    </div>

    <!-- 2. MAIN APP -->
    <div id="app">
        <header>
            <div class="logo-group">
                <i class="fas fa-running"></i>
                <div>
                    <div class="title">StudyRun</div>
                    <div class="subtitle">UP Board Class 10th</div>
                </div>
            </div>
            <i class="fas fa-graduation-cap"></i>
        </header>

        <!-- DASHBOARD GRID -->
        <div id="dashboard">
            <div class="card" onclick="showSection('maths')">
                <i class="fas fa-square-root-variable"></i>
                <h3>गणित सूत्र</h3>
            </div>
            <div class="card" onclick="showSection('syllabus')">
                <i class="fas fa-list-check"></i>
                <h3>पाठ्यक्रम (Syllabus)</h3>
            </div>
            <div class="card" onclick="showSection('books')">
                <i class="fas fa-book-bookmark"></i>
                <h3>NCERT किताबें</h3>
            </div>
            <div class="card" onclick="showSection('pyq')">
                <i class="fas fa-file-lines"></i>
                <h3>PYQ पेपर</h3>
            </div>
            <div class="card" onclick="showSection('notes')">
                <i class="fas fa-note-sticky"></i>
                <h3>हस्तलिखित नोट्स</h3>
            </div>
            <div class="card" onclick="showSection('quiz')">
                <i class="fas fa-brain"></i>
                <h3>क्विज मेकर</h3>
            </div>
        </div>

        <!-- CONTENT VIEW -->
        <div id="content-area">
            <button class="btn-back" onclick="hideSection()"><i class="fas fa-arrow-left"></i> होम</button>
            <div id="dynamic-body"></div>
        </div>
    </div>

    <script>
        function launchApp() {
            document.getElementById('splash-screen').style.display = 'none';
            document.getElementById('app').style.display = 'block';
        }

        const sectionsData = {
            maths: `
                <div class="section-header">गणित अध्यायवार सूत्र (UP Board)</div>
                <div class="formula-box">
                    <h4>1. वास्तविक संख्याएँ</h4>
                    <p>यूक्लिड विभाजन प्रमेयिका: a = bq + r (0 ≤ r < b)</p>
                    <div class="formula-code">HCF(a, b) × LCM(a, b) = a × b</div>
                </div>
                <div class="formula-box">
                    <h4>2. द्विघात समीकरण</h4>
                    <p>मानक रूप: ax² + bx + c = 0</p>
                    <div class="formula-code">श्रीधराचार्य सूत्र: x = [-b ± √(b² - 4ac)] / 2a</div>
                    <div class="formula-code">विविक्तकर (Discriminant): D = b² - 4ac</div>
                </div>
                <div class="formula-box">
                    <h4>3. निर्देशांक ज्यामिति</h4>
                    <div class="formula-code">दूरी सूत्र: d = √[(x₂ - x₁)² + (y₂ - y₁)²]</div>
                    <div class="formula-code">विभाजन सूत्र: [(m₁x₂ + m₂x₁)/(m₁+m₂), (m₁y₂ + m₂y₁)/(m₁+m₂)]</div>
                </div>
                <div class="formula-box">
                    <h4>4. त्रिकोणमिति</h4>
                    <div class="formula-code">sin²θ + cos²θ = 1</div>
                    <div class="formula-code">1 + tan²θ = sec²θ</div>
                    <div class="formula-code">1 + cot²θ = cosec²θ</div>
                </div>
            `,
            syllabus: `
                <div class="section-header">UP Board Class 10 Syllabus</div>
                <ul class="item-list">
                    <li class="item-card"><span class="item-title">गणित (Maths) - अंक: 70</span><a href="https://www.selfstudys.com/books/up/state-books/class-10th/up-board-class-10th-syllabus" target="_blank" class="item-btn">देखें</a></li>
                    <li class="item-card"><span class="item-title">विज्ञान (Science) - अंक: 70</span><a href="https://www.selfstudys.com/books/up/state-books/class-10th/up-board-class-10th-syllabus" target="_blank" class="item-btn">देखें</a></li>
                    <li class="item-card"><span class="item-title">सामाजिक विज्ञान - अंक: 70</span><a href="https://www.selfstudys.com/books/up/state-books/class-10th/up-board-class-10th-syllabus" target="_blank" class="item-btn">देखें</a></li>
                    <li class="item-card"><span class="item-title">हिंदी (Hindi) - अंक: 70</span><a href="https://www.selfstudys.com/books/up/state-books/class-10th/up-board-class-10th-syllabus" target="_blank" class="item-btn">देखें</a></li>
                    <li class="item-card"><span class="item-title">अंग्रेजी (English) - अंक: 70</span><a href="https://www.selfstudys.com/books/up/state-books/class-10th/up-board-class-10th-syllabus" target="_blank" class="item-btn">देखें</a></li>
                </ul>
            `,
            books: `
                <div class="section-header">UP Board Hindi Medium Books</div>
                <ul class="item-list">
                    <li class="item-card"><span class="item-title">गणित NCERT टेक्स्टबुक</span><a href="https://www.selfstudys.com/books/up/state-books/class-10th/%E0%A4%97%E0%A4%A3%E0%A4%BF%E0%A4%A4/26926" target="_blank" class="item-btn">PDF</a></li>
                    <li class="item-card"><span class="item-title">विज्ञान NCERT टेक्स्टबुक</span><a href="https://www.selfstudys.com/state-wise/up/class-10th" target="_blank" class="item-btn">PDF</a></li>
                    <li class="item-card"><span class="item-title">सामाजिक विज्ञान (इतिहास/भूगोल/नागरिक/अर्थशास्त्र)</span><a href="https://www.selfstudys.com/state-wise/up/class-10th" target="_blank" class="item-btn">PDF</a></li>
                </ul>
            `,
            pyq: `
                <div class="section-header">पिछले वर्षों के प्रश्न पत्र (Previous Year Papers)</div>
                <ul class="item-list">
                    <li class="item-card"><span class="item-title">2024 UP Board - गणित पेपर</span><a href="https://www.selfstudys.com/state-wise/up/class-10th" target="_blank" class="item-btn">Download</a></li>
                    <li class="item-card"><span class="item-title">2024 UP Board - विज्ञान पेपर</span><a href="https://www.selfstudys.com/state-wise/up/class-10th" target="_blank" class="item-btn">Download</a></li>
                    <li class="item-card"><span class="item-title">2023 UP Board - सभी विषय पेपर</span><a href="https://www.selfstudys.com/state-wise/up/class-10th" target="_blank" class="item-btn">Download</a></li>
                </ul>
            `,
            notes: `
                <div class="section-header">Handmade & Revision Notes</div>
                <ul class="item-list">
                    <li class="item-card"><span class="item-title">विज्ञान - रासायनिक अभिक्रियाएं एवं समीकरण (Handmade)</span><a href="https://www.selfstudys.com/books/ncert-notes/hindi/class-10th" target="_blank" class="item-btn">पढ़ें</a></li>
                    <li class="item-card"><span class="item-title">गणित - त्वरित रिवीजन नोट्स</span><a href="https://www.selfstudys.com/books/ncert-notes/hindi/class-10th/%E0%A4%97%E0%A4%A3%E0%A4%BF%E0%A4%A4/2785" target="_blank" class="item-btn">पढ़ें</a></li>
                </ul>
            `,
            quiz: `
                <div class="section-header">अनलिमिटेड क्विज मेकर (Quiz Maker)</div>
                <div class="quiz-container">
                    <p style="margin-bottom: 10px; color: var(--text-dim);">अपना प्रश्न और विकल्प यहाँ डालें:</p>
                    <textarea placeholder="प्रश्न लिखें... (उदा: प्रकाश का वेग निर्वात में कितना होता है?)"></textarea>
                    <div style="display: grid; gap: 8px; margin-bottom: 15px;">
                        <input type="text" placeholder="विकल्प A" style="padding: 10px; background: #0f172a; border: 1px solid var(--border); color: white; border-radius: 6px;">
                        <input type="text" placeholder="विकल्प B" style="padding: 10px; background: #0f172a; border: 1px solid var(--border); color: white; border-radius: 6px;">
                    </div>
                    <button class="item-btn" style="width: 100%; padding: 10px;" onclick="alert('क्विज प्रश्न सफलतापूर्वक बन गया!')">क्विज जनरेट करें</button>
                </div>
            `
        };

        function showSection(key) {
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('content-area').style.display = 'block';
            document.getElementById('dynamic-body').innerHTML = sectionsData[key];
        }

        function hideSection() {
            document.getElementById('dashboard').style.display = 'grid';
            document.getElementById('content-area').style.display = 'none';
        }
    </script>
</body>
</html>
